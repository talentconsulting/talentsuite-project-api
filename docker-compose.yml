services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong!Passw0rd", "-Q", "SELECT 1", "-C"]
      interval: 1s
      retries: 5
      start_period: 20s
      timeout: 5s
  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: db_init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db-init:/db-init
    entrypoint: ["/db-init/entrypoint.sh"]
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talent-suite-projects-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=MyDatabase;User Id=sa;Password=YourStrong!Passw0rd;"
    entrypoint: ["./wait-for-it.sh", "sqlserver:1433", "--", "dotnet", "MyApp.dll"]
volumes:
  mssql_data:
networks:
  app_network:
    driver: bridge